# ดึงข้อมูลระดับน้ำทุก 15 นาที แล้วขึ้นเว็บ GitHub Pages
name: update

on:
  schedule:
    - cron: '7,22,37,52 * * * *'   # GitHub อาจช้ากว่ากำหนดได้บ้างช่วงคนใช้เยอะ
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      notify_test:
        description: 'ส่งแจ้งเตือนทดสอบ'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy_try.outputs.page_url || steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: npm test
      - name: Fetch water levels
        env:
          SEED_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NOTIFY_TEST: ${{ inputs.notify_test && '1' || '' }}
        run: npm run fetch
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      # GitHub Pages ล้มเหลวชั่วคราวได้ (เจอ 5 ต.ค. 01:15) → ลองซ้ำอีกครั้งก่อนแจ้ง "ระบบขัดข้อง"
      - id: deploy_try
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deploy_try.outcome == 'failure'
        run: sleep 30
      - id: deploy
        if: steps.deploy_try.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - name: Alert on failure
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$NTFY_TOPIC" ] || exit 0
          curl -s -m 20 -X POST https://ntfy.sh -H 'Content-Type: application/json' \
            -d "{\"topic\":\"$NTFY_TOPIC\",\"title\":\"⚠️ ระบบเตือนน้ำท่วมขัดข้อง\",\"message\":\"รอบอัปเดตล่าสุดทำงานไม่สำเร็จ ข้อมูลบนเว็บอาจค้าง — ช่วยดูคลองเองและแจ้งคนดูแลระบบ\",\"priority\":4,\"tags\":[\"warning\"],\"click\":\"$RUN_URL\"}" || true
